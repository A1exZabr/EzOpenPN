version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-runtime:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /runtime
    schedule:
      interval: weekly
      day: monday
    groups:
      go-runtime:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /tests/browser
    schedule:
      interval: weekly
      day: monday
    groups:
      browser-evidence:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      container-builds:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      workflow-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
