name: Candidate release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed tag in vMAJOR.MINOR.PATCH form
        required: true
        type: string
      images_run_id:
        description: Successful Images workflow run ID for this commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and sign testable release assets
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"
      - name: Verify signed immutable source tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          git config --local gpg.ssh.allowedSignersFile .github/release-allowed-signers
          git verify-tag "$RELEASE_TAG"
      - name: Verify required source checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo A1exZabr/EzOpenPN --commit "$GITHUB_SHA" \
            --limit 30 --json workflowName,status,conclusion >"$RUNNER_TEMP/source-runs.json"
          python - "$RUNNER_TEMP/source-runs.json" <<'PY'
          import json
          import sys

          runs = json.load(open(sys.argv[1], encoding="utf-8"))
          successful = {
              run["workflowName"]
              for run in runs
              if run["status"] == "completed" and run["conclusion"] == "success"
          }
          missing = {"CI", "CodeQL"} - successful
          if missing:
              raise SystemExit("required source checks did not pass")
          PY
      - name: Install locked release tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.7
          bash tools/lock_toolchain.sh --install "$RUNNER_TEMP/ezopenpn-tools" cosign syft
          echo "$RUNNER_TEMP/ezopenpn-tools/bin" >> "$GITHUB_PATH"
      - name: Select the successful immutable Images artifact
        id: image_input
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES_RUN_ID: ${{ inputs.images_run_id }}
        run: |
          bash tools/release_input.sh images "$IMAGES_RUN_ID" "$GITHUB_SHA" \
            "images-release-$GITHUB_SHA" images >> "$GITHUB_OUTPUT"
      - name: Download verified image manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.image_input.outputs.images_artifact_id }}
          merge-multiple: true
          path: image-evidence
          run-id: ${{ inputs.images_run_id }}
          github-token: ${{ github.token }}
      - name: Verify signed source images
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          IMAGES_RUN_ID: ${{ inputs.images_run_id }}
          IMAGES_RUN_ATTEMPT: ${{ steps.image_input.outputs.images_run_attempt }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          bash tools/verify_image_attestations.sh \
            --manifest image-evidence/images.release.json \
            --sbom-dir "$GITHUB_WORKSPACE/image-evidence/artifacts/sbom" \
            --provenance-dir "$GITHUB_WORKSPACE/image-evidence/artifacts/provenance" \
            --run-id "$IMAGES_RUN_ID" --run-attempt "$IMAGES_RUN_ATTEMPT"
      - name: Verify anonymous GHCR downloads with no saved credentials
        run: |
          bash tools/verify_public_images.sh image-evidence/images.release.json
      - name: Build deterministic bundle and SPDX SBOM
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          bash tools/build_release.sh \
            --version "$RELEASE_TAG" \
            --source-commit "$GITHUB_SHA" \
            --images-manifest image-evidence/images.release.json \
            --output "$GITHUB_WORKSPACE/dist"
          extracted="$(mktemp -d "$RUNNER_TEMP/ezopenpn-release-sbom.XXXXXXXX")"
          tar -xzf dist/ezopenpn-bundle.tar.gz -C "$extracted"
          syft "dir:$extracted" --output spdx-json >dist/ezopenpn-bundle.spdx.json
          bash tools/verify_release.sh dist
      - name: Sign bundle and checksums with GitHub OIDC
        run: |
          cosign sign-blob --yes \
            --bundle dist/ezopenpn-bundle.sigstore.json \
            dist/ezopenpn-bundle.tar.gz
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.sigstore.json \
            dist/SHA256SUMS
      - name: Verify signed release assets
        run: |
          bash tools/verify_release.sh --signed dist
      - name: Upload signed candidate assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-candidate-${{ inputs.tag }}
          path: dist
          if-no-files-found: error
          retention-days: 30
      - name: Bind candidate to the exact tested images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-images-${{ inputs.tag }}
          path: image-evidence/images.release.json
          if-no-files-found: error
          retention-days: 30
