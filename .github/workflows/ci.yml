name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.11"
      - name: Check repository content
        run: python tools/content_guard.py .

  python:
    needs: content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.11"
      - name: Install locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.7
          uv sync --all-groups --frozen
      - name: Check formatting and types
        run: |
          uv run ruff check .
          uv run mypy control/src/ezopenpn
      - name: Run tests with branch coverage
        run: uv run pytest --cov=ezopenpn --cov-branch --cov-report=term-missing
      - name: Check source security
        run: uv run bandit -q -c pyproject.toml -r control/src
      - name: Audit locked dependencies
        run: uv run pip-audit

  control-image:
    needs: content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and inspect the control image
        run: bash tests/compose/control-smoke.sh
