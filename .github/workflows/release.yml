name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed tag in vMAJOR.MINOR.PATCH form
        required: true
        type: string
      images_run_id:
        description: Successful Images workflow run ID for this commit
        required: true
        type: string
      evidence_run_id:
        description: Successful evidence workflow run ID for this commit
        required: true
        type: string
      vm_run_id:
        description: Successful four-system VM Matrix run for the same images
        required: true
        type: string
      candidate_run_id:
        description: Successful Candidate release run whose exact bundle was tested
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and promote the tested candidate
    runs-on: ubuntu-24.04
    outputs:
      bundle_sha256: ${{ steps.verify.outputs.bundle_sha256 }}
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"
      - name: Verify signed immutable source tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          git config --local gpg.ssh.allowedSignersFile .github/release-allowed-signers
          git verify-tag "$RELEASE_TAG"
      - name: Verify required source checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo A1exZabr/EzOpenPN --commit "$GITHUB_SHA" \
            --limit 30 --json workflowName,status,conclusion >"$RUNNER_TEMP/source-runs.json"
          python - "$RUNNER_TEMP/source-runs.json" <<'PY'
          import json
          import sys

          runs = json.load(open(sys.argv[1], encoding="utf-8"))
          successful = {
              run["workflowName"]
              for run in runs
              if run["status"] == "completed" and run["conclusion"] == "success"
          }
          missing = {"CI", "CodeQL"} - successful
          if missing:
              raise SystemExit("required source checks did not pass")
          PY
      - name: Select successful source-bound release inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES_RUN_ID: ${{ inputs.images_run_id }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          VM_RUN_ID: ${{ inputs.vm_run_id }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          {
            bash tools/release_input.sh images "$IMAGES_RUN_ID" "$GITHUB_SHA" \
              "images-release-$GITHUB_SHA" images
            bash tools/release_input.sh vm-matrix "$VM_RUN_ID" "$GITHUB_SHA" \
              "vm-images-$GITHUB_SHA" vm
            bash tools/release_input.sh evidence "$EVIDENCE_RUN_ID" "$GITHUB_SHA" \
              "release-evidence-$GITHUB_SHA" evidence "$TAG"
            bash tools/release_input.sh candidate-release "$CANDIDATE_RUN_ID" "$GITHUB_SHA" \
              "signed-candidate-$TAG" candidate "$TAG"
            bash tools/release_input.sh candidate-release "$CANDIDATE_RUN_ID" "$GITHUB_SHA" \
              "candidate-images-$TAG" candidate_images "$TAG"
          } >> "$GITHUB_OUTPUT"
      - name: Install locked release tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.7
          bash tools/lock_toolchain.sh --install "$RUNNER_TEMP/ezopenpn-tools" cosign
          echo "$RUNNER_TEMP/ezopenpn-tools/bin" >> "$GITHUB_PATH"
      - name: Download verified image manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.inputs.outputs.images_artifact_id }}
          merge-multiple: true
          path: image-evidence
          run-id: ${{ inputs.images_run_id }}
          github-token: ${{ github.token }}
      - name: Download external evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.inputs.outputs.evidence_artifact_id }}
          merge-multiple: true
          path: release-evidence
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Download images actually used by the four-system VM run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.inputs.outputs.vm_artifact_id }}
          merge-multiple: true
          path: vm-images
          run-id: ${{ inputs.vm_run_id }}
          github-token: ${{ github.token }}
      - name: Download the exact tested candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.inputs.outputs.candidate_artifact_id }}
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download the candidate image binding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.inputs.outputs.candidate_images_artifact_id }}
          merge-multiple: true
          path: candidate-images
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify image and network evidence
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          IMAGES_RUN_ID: ${{ inputs.images_run_id }}
          IMAGES_RUN_ATTEMPT: ${{ steps.inputs.outputs.images_run_attempt }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          bash tools/verify_image_attestations.sh \
            --manifest image-evidence/images.release.json \
            --sbom-dir "$GITHUB_WORKSPACE/image-evidence/artifacts/sbom" \
            --provenance-dir "$GITHUB_WORKSPACE/image-evidence/artifacts/provenance" \
            --run-id "$IMAGES_RUN_ID" --run-attempt "$IMAGES_RUN_ATTEMPT"
          test "$(jq -r '.source.commit' image-evidence/images.release.json)" = "$GITHUB_SHA"
          cmp --silent image-evidence/images.release.json vm-images/images.release.json
          cmp --silent image-evidence/images.release.json candidate-images/images.release.json
          bash tools/verify_public_images.sh image-evidence/images.release.json
          metadata="$(bash tools/verify_release.sh --signed dist)"
          test "$(sed -n '1,2p' <<< "$metadata")" = "$RELEASE_TAG"$'\n'"$GITHUB_SHA"
          digest="$(sha256sum dist/ezopenpn-bundle.tar.gz | awk '{print $1}')"
          python tests/release/validate_evidence.py release-evidence \
            --expected-version "$RELEASE_TAG" --expected-bundle-sha256 "$digest"
          echo "bundle_sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify signed release assets
        run: |
          bash tools/verify_release.sh --signed dist
      - name: Upload signed release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-release-${{ inputs.tag }}
          path: dist
          if-no-files-found: error
          retention-days: 30

  draft:
    name: Create private draft release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download signed assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: signed-release-${{ inputs.tag }}
          path: assets
      - name: Create draft or reuse the immutable preview
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if existing="$(gh release view "$RELEASE_TAG" --repo A1exZabr/EzOpenPN \
            --json tagName,isDraft,isPrerelease 2>/dev/null)"; then
            jq -e --arg tag "$RELEASE_TAG" \
              '.tagName == $tag and (.isDraft == true or .isPrerelease == true)' \
              <<< "$existing" >/dev/null
            # Existing assets are not overwritten; verify-draft compares every byte next.
            exit 0
          fi
          gh release create "$RELEASE_TAG" assets/* \
            --repo A1exZabr/EzOpenPN \
            --verify-tag \
            --draft \
            --title "EzOpenPN $RELEASE_TAG" \
            --notes "Проверенный выпуск EzOpenPN. Начните с install.sh и документации."

  verify-draft:
    name: Verify downloaded draft assets
    needs: draft
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"
      - name: Install locked verification tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.7
          bash tools/lock_toolchain.sh --install "$RUNNER_TEMP/ezopenpn-tools" cosign
          echo "$RUNNER_TEMP/ezopenpn-tools/bin" >> "$GITHUB_PATH"
      - name: Download expected signed assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: signed-release-${{ inputs.tag }}
          path: expected
      - name: Download and independently verify draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          install -d -m 0700 downloaded
          gh release download "$RELEASE_TAG" \
            --repo A1exZabr/EzOpenPN \
            --dir downloaded
          python - expected downloaded <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          expected = Path(sys.argv[1])
          actual = Path(sys.argv[2])
          expected_files = {path.name: path for path in expected.iterdir() if path.is_file()}
          actual_files = {path.name: path for path in actual.iterdir() if path.is_file()}
          if set(expected_files) != set(actual_files):
              raise SystemExit("draft release asset set changed")
          for name in expected_files:
              first = hashlib.sha256(expected_files[name].read_bytes()).digest()
              second = hashlib.sha256(actual_files[name].read_bytes()).digest()
              if first != second:
                  raise SystemExit("draft release asset changed")
          PY
          bash tools/verify_release.sh --signed downloaded

  publish:
    name: Publish verified release
    needs: [build, verify-draft]
    runs-on: ubuntu-24.04
    concurrency:
      group: ezopenpn-stable-channel
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"
      - name: Install locked verification tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.7
          bash tools/lock_toolchain.sh --install "$RUNNER_TEMP/ezopenpn-tools" cosign
          echo "$RUNNER_TEMP/ezopenpn-tools/bin" >> "$GITHUB_PATH"
      - name: Verify anonymous preview before promoting and check latest
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.build.outputs.bundle_sha256 }}
        run: |
          [[ "$EXPECTED_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          previous_tag="$(gh release list --repo A1exZabr/EzOpenPN --limit 1000 \
            --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')"
          [[ -z "$previous_tag" || "$previous_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$previous_tag" == "$RELEASE_TAG" ]]; then
            bash tools/verify_release.sh --stable "$RELEASE_TAG" "$GITHUB_SHA" "$EXPECTED_BUNDLE_SHA256"
            exit 0
          fi
          gh release edit "$RELEASE_TAG" --repo A1exZabr/EzOpenPN --draft=false --prerelease --latest=false
          bash tools/verify_release.sh --published "$RELEASE_TAG" "$GITHUB_SHA"
          if ! gh release edit "$RELEASE_TAG" --repo A1exZabr/EzOpenPN --prerelease=false --latest \
            || ! bash tools/verify_release.sh --stable "$RELEASE_TAG" "$GITHUB_SHA" "$EXPECTED_BUNDLE_SHA256"; then
            gh release edit "$RELEASE_TAG" --repo A1exZabr/EzOpenPN --prerelease --latest=false
            if [[ -n "$previous_tag" ]]; then
              gh release edit "$previous_tag" --repo A1exZabr/EzOpenPN --latest
            fi
            echo "stable publication failed; candidate remains a prerelease" >&2
            exit 1
          fi
