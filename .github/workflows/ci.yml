name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"
      - name: Check repository content
        run: python tools/content_guard.py .

  python:
    needs: content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"
      - name: Install locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.7
          uv sync --all-groups --frozen
      - name: Check formatting and types
        run: |
          uv run ruff check .
          uv run mypy control/src/ezopenpn
      - name: Run tests with branch coverage
        run: |
          uv run pytest --cov=ezopenpn --cov-branch --cov-report=term-missing
          uv run pytest -q tests/docs tests/release tests/security tests/vm
      - name: Check source security
        run: uv run bandit -q -c pyproject.toml -r control/src
      - name: Audit locked dependencies
        run: |
          uv export --frozen --all-groups --no-emit-project \
            --format requirements.txt --output-file "$RUNNER_TEMP/requirements.txt" --quiet
          uv run pip-audit --strict --requirement "$RUNNER_TEMP/requirements.txt"

  browser:
    name: Browser and accessibility
    needs: content
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - name: Install locked browser environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.7
          uv sync --all-groups --frozen
          npm --prefix tests/browser ci --ignore-scripts
          npm --prefix tests/browser audit --audit-level=high
          npx --prefix tests/browser playwright install --with-deps chromium
      - name: Verify panel workflows and safe evidence
        run: |
          npm --prefix tests/browser test
          test -s docs/images/panel-login.png
          test -s docs/images/profile-card.png
          uv run python tools/content_guard.py docs/images

  go:
    name: Go
    needs: content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.7"
          cache: false
      - name: Test helpers with the race detector
        working-directory: runtime
        run: go test -race ./...

  shell:
    name: Shell and documentation
    needs: content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"
      - name: Install uv and locked tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.7
          bash tools/lock_toolchain.sh --install "$RUNNER_TEMP/ezopenpn-tools" \
            actionlint bats lychee reuse shellcheck
          echo "$RUNNER_TEMP/ezopenpn-tools/bin" >> "$GITHUB_PATH"
      - name: Run shell and documentation gates
        run: |
          bats tests/shell
          shellcheck installer/install.sh installer/installer-main.sh \
            installer/bin/ezopenpn installer/lib/*.sh tools/*.sh tests/vm/*.sh
          actionlint .github/workflows/*.yml
          lychee --offline --no-progress README.md docs/*.md
          reuse lint

  control-image:
    needs: content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and inspect the control image
        run: bash tests/compose/control-smoke.sh

  compose-security:
    needs: content
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"
      - name: Install locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.7
          uv sync --all-groups --frozen
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nmap
      - name: Verify upstream image locks
        run: bash tools/lock_images.sh --check
      - name: Validate gateway and Compose configuration
        run: |
          PUBLIC_IP=203.0.113.10 bash tests/compose/caddy-adapt.sh >/dev/null
          uv run pytest -q \
            tests/compose/test_image_lock.py \
            tests/compose/test_caddy_config.py \
            tests/compose/test_compose_policy.py \
            tests/compose/test_compose_render.py
      - name: Build and inspect runtime images
        run: |
          docker build -f runtime/Dockerfile.xray -t ezopenpn-xray:ci .
          docker build -f runtime/Dockerfile.cert-sync -t ezopenpn-cert-sync:ci .
          docker build -f runtime/Dockerfile.gateway -t ezopenpn-gateway:ci .
          test "$(docker image inspect ezopenpn-xray:ci --format '{{.Config.User}}')" = "10002:11001"
          test "$(docker image inspect ezopenpn-cert-sync:ci --format '{{.Config.User}}')" = "10004:11003"
          test "$(docker image inspect ezopenpn-gateway:ci --format '{{.Config.User}}')" = "10004:11003"
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --entrypoint caddy ezopenpn-gateway:ci version
          if docker run --rm --entrypoint /bin/sh ezopenpn-xray:ci -c true 2>/dev/null; then
            echo "xray image unexpectedly contains a shell" >&2
            exit 1
          fi
          if docker run --rm --entrypoint /bin/sh ezopenpn-cert-sync:ci -c true 2>/dev/null; then
            echo "cert-sync image unexpectedly contains a shell" >&2
            exit 1
          fi
      - name: Prepare the complete stack harness
        run: bash tests/compose/stack-up.sh
      - name: Verify the complete stack
        run: |
          uv run pytest -q \
            tests/compose/test_stack_health.py \
            tests/compose/test_certificate_rotation.py \
            tests/compose/test_runtime_security.py \
            -m integration
          sudo bash tests/compose/scan_ports.sh 127.0.0.1 22
      - name: Stop the complete stack harness
        if: always()
        run: bash tests/compose/stack-down.sh

  runtime-integration:
    needs: content
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"
      - name: Install locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.7
          uv sync --all-groups --frozen
      - name: Verify pinned transport runtimes
        run: uv run pytest -q tests/compose/test_runtime.py -m integration

  dependency-audit:
    name: Dependency audit
    needs: content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.7"
          cache: false
      - name: Install locked audit tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.7
          uv sync --all-groups --frozen
          bash tools/lock_toolchain.sh --install "$RUNNER_TEMP/ezopenpn-tools" govulncheck
          echo "$RUNNER_TEMP/ezopenpn-tools/bin" >> "$GITHUB_PATH"
      - name: Audit Python and Go dependencies
        run: |
          uv export --frozen --all-groups --no-emit-project \
            --format requirements.txt --output-file "$RUNNER_TEMP/requirements.txt" --quiet
          uv run pip-audit --strict --requirement "$RUNNER_TEMP/requirements.txt"
          cd runtime
          govulncheck ./...

  secret-scan:
    name: Secret scan
    needs: content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"
      - name: Install locked secret scanner
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.7
          bash tools/lock_toolchain.sh --install "$RUNNER_TEMP/ezopenpn-tools" gitleaks
          echo "$RUNNER_TEMP/ezopenpn-tools/bin" >> "$GITHUB_PATH"
      - name: Scan complete reachable history
        run: gitleaks git --redact --no-banner --config .gitleaks.toml

  image-scan:
    name: Image scan
    needs: content
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"
      - name: Install locked image scanner
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.7
          bash tools/lock_toolchain.sh --install "$RUNNER_TEMP/ezopenpn-tools" trivy
          echo "$RUNNER_TEMP/ezopenpn-tools/bin" >> "$GITHUB_PATH"
      - name: Build immutable local images
        run: |
          docker build -f control/Dockerfile -t ezopenpn-control:scan .
          docker build -f runtime/Dockerfile.xray -t ezopenpn-xray:scan .
          docker build -f runtime/Dockerfile.cert-sync -t ezopenpn-cert-sync:scan .
          docker build -f runtime/Dockerfile.gateway -t ezopenpn-gateway:scan .
      - name: Reject high and critical image findings
        run: |
          for image in \
            ezopenpn-control:scan \
            ezopenpn-xray:scan \
            ezopenpn-cert-sync:scan \
            ezopenpn-gateway:scan; do
            trivy image --quiet --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 "$image"
          done
